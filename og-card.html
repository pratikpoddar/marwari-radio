<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Marcellus&family=Rye&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;overflow:hidden;position:relative;
    background-color:#4a0f18;
    background-image:
      radial-gradient(circle at 50% 50%, rgba(246,234,208,.20) 0 3px, transparent 4.2px),
      radial-gradient(circle at 50% 50%, rgba(212,160,23,.16) 0 2.2px, transparent 3.4px),
      radial-gradient(circle at 50% 20%, rgba(122,31,43,.9), rgba(74,15,24,1) 65%);
    background-size:56px 56px,56px 56px,100% 100%;
    background-position:0 0,28px 28px,0 0;
    font-family:'Marcellus',Georgia,serif;color:#f6ead0}
  .frame{position:absolute;inset:26px;border-radius:20px;
    background-image:repeating-linear-gradient(135deg,#d94f70 0 18px,#f6ead0 18px 30px,#1f6b52 30px 48px,#d4a017 48px 60px);
    padding:14px}
  .inner{height:100%;border-radius:12px;display:flex;align-items:center;gap:52px;padding:0 62px;
    background-color:#6d3b1c;
    background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 2px,rgba(255,255,255,.05) 2px 6px,rgba(0,0,0,0) 6px 18px),
      linear-gradient(180deg,#92552a,#6d3b1c 45%,#3b1d0c)}
  .dialart{flex:0 0 300px}
  h1{font-family:'Yatra One',serif;font-size:86px;margin:0;line-height:1.05;color:#fff3d4;text-shadow:0 3px 0 rgba(0,0,0,.45)}
  .rom{font-family:'Rye',serif;font-size:27px;letter-spacing:.24em;color:#f2cf62;margin:14px 0 0}
  .tag{font-size:29px;line-height:1.5;margin:26px 0 0;color:#ffe9b8;font-style:italic;max-width:520px}
  .chips{margin:30px 0 0;display:flex;gap:11px;flex-wrap:wrap;max-width:560px}
  .chips span{font-size:17px;letter-spacing:.1em;padding:9px 16px;border:1.5px solid rgba(242,207,98,.65);
    border-radius:999px;color:#ffeec4}
</style>
<div class="frame"><div class="inner">
  <div class="dialart">
    <svg viewBox="0 0 300 300" width="300" height="300">
      <circle cx="150" cy="150" r="140" fill="none" stroke="rgba(242,207,98,.35)" stroke-width="5"/>
      <circle cx="150" cy="150" r="112" fill="rgba(212,160,23,.12)" stroke="#f2cf62" stroke-width="2.5"/>
      <g stroke="#f2cf62" stroke-width="6" stroke-linecap="round">
        <line x1="150" y1="48" x2="150" y2="78"/><line x1="150" y1="222" x2="150" y2="252"/>
        <line x1="48" y1="150" x2="78" y2="150"/><line x1="222" y1="150" x2="252" y2="150"/>
      </g>
      <g stroke="rgba(242,207,98,.6)" stroke-width="3" stroke-linecap="round">
        <line x1="78" y1="78" x2="97" y2="97"/><line x1="222" y1="78" x2="203" y2="97"/>
        <line x1="78" y1="222" x2="97" y2="203"/><line x1="222" y1="222" x2="203" y2="203"/>
      </g>
      <line x1="150" y1="150" x2="222" y2="93" stroke="#e03024" stroke-width="8" stroke-linecap="round"/>
      <circle cx="150" cy="150" r="16" fill="#f2cf62"/>
    </svg>
  </div>
  <div>
    <h1 id="h1">म्हारो रेडियो</h1>
    <p class="rom" id="rom">MARWARI &middot; RADIO</p>
    <p class="tag" id="tag">राम राम सा! पधारो म्हारे देस।<br>ताई गीतां रे बीच में मारवाड़ी में बतळावै।</p>
    <div class="chips" id="chips">
      <span>भक्ति बेला</span><span>शादी संगीत</span><span>गणगौर अर तीज</span><span>रेल यात्रा</span><span>पुराणी यादें</span>
    </div>
  </div>
</div></div>
<script>
/* og-card.html?station=<id> renders that station's card; no query = the
   home card. scripts/build.py screenshots each one into assets/. */
(async function () {
  var want = new URLSearchParams(location.search).get('station');
  document.documentElement.dataset.ready = '0';
  if (!want) { document.documentElement.dataset.ready = '1'; return; }
  var cfg = await (await fetch('stations.json')).json();
  var s = cfg.stations.filter(function (x) { return x.id === want; })[0];
  if (!s) { document.documentElement.dataset.ready = '1'; return; }
  document.getElementById('h1').textContent = s.name;
  document.getElementById('rom').innerHTML = s.nameRoman.toUpperCase().split('').join('') ;
  document.getElementById('rom').textContent = s.nameRoman.toUpperCase();
  document.getElementById('tag').innerHTML =
    s.tagline + '<br><span style="font-size:.8em;opacity:.85">' + s.occasion + '</span>';
  document.getElementById('chips').innerHTML = s.tracks.slice(0, 4).map(function (t) {
    return '<span>' + t.title + '</span>';
  }).join('') + '<span>ताई · Tai</span>';
  document.documentElement.dataset.ready = '1';
})();
</script>
